services:
  studyhub:
    build: .
    container_name: studyhub-app
    restart: unless-stopped
    environment:
      SECRET_KEY: "replace-with-a-long-random-secret"
      DATA_DIR: "/app/data"
    volumes:
      - studyhub_data:/app/data
    expose:
      - "5000"

  nginx:
    image: nginx:alpine
    container_name: studyhub-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - studyhub

volumes:
  studyhub_data:
